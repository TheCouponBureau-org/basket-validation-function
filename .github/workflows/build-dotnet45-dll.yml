name: Build .NET Framework 4.5 DLL

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-dotnet45-dll.yml"
      - "dotnet45/**"
      - "js/basket_validation.js"
  pull_request:
    paths:
      - ".github/workflows/build-dotnet45-dll.yml"
      - "dotnet45/**"
      - "js/basket_validation.js"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build native net45 SDK
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dotnet45/package-lock.json

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Build DLL
        working-directory: dotnet45
        shell: cmd
        run: call build-dll.cmd

      - name: Stage build output
        shell: pwsh
        run: |
          $dll = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE/dotnet45/bin/Release" `
            -Filter "TcbBasketValidation.Client.dll" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($null -eq $dll) {
            throw "TcbBasketValidation.Client.dll was not found under dotnet45/bin/Release."
          }

          $artifactDirectory = "$env:GITHUB_WORKSPACE/artifacts"
          New-Item -ItemType Directory -Path $artifactDirectory -Force | Out-Null
          Copy-Item $dll.FullName "$artifactDirectory/TcbBasketValidation.Client.dll"
          Write-Host "Staged DLL from $($dll.FullName)"

      - name: Build DLL smoke tests
        shell: pwsh
        run: >-
          dotnet build
          dotnet45/tests/TcbBasketValidation.Client.SmokeTests.csproj
          --configuration Release

      - name: Run DLL smoke tests
        shell: pwsh
        run: >-
          & "dotnet45/tests/bin/Release/net45/TcbBasketValidation.Client.SmokeTests.exe"

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v7
        with:
          name: TcbBasketValidation.Client-net45
          path: artifacts/TcbBasketValidation.Client.dll
          if-no-files-found: error

  publish-release:
    name: Publish release asset
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download DLL artifact
        uses: actions/download-artifact@v8
        with:
          name: TcbBasketValidation.Client-net45
          path: release-artifact

      - name: Attach DLL to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload
          "${{ github.event.release.tag_name }}"
          "release-artifact/TcbBasketValidation.Client.dll"
          --clobber
