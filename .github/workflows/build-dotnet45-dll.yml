name: Build .NET Framework 4.5 DLL

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-dotnet45-dll.yml"
      - "dotnet45/**"
      - "js/basket_validation.js"
  pull_request:
    paths:
      - ".github/workflows/build-dotnet45-dll.yml"
      - "dotnet45/**"
      - "js/basket_validation.js"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build native net45 SDK
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dotnet45/package-lock.json

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build DLL
        working-directory: dotnet45
        shell: cmd
        run: build-dll.cmd

      - name: Verify build output
        shell: pwsh
        run: |
          $dll = "dotnet45/bin/Release/net45/TcbBasketValidation.Client.dll"
          if (-not (Test-Path $dll)) {
            throw "Expected build output was not created: $dll"
          }

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: TcbBasketValidation.Client-net45
          path: dotnet45/bin/Release/net45/TcbBasketValidation.Client.dll
          if-no-files-found: error

  publish-release:
    name: Publish release asset
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download DLL artifact
        uses: actions/download-artifact@v4
        with:
          name: TcbBasketValidation.Client-net45
          path: release-artifact

      - name: Attach DLL to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload
          "${{ github.event.release.tag_name }}"
          "release-artifact/TcbBasketValidation.Client.dll"
          --clobber
