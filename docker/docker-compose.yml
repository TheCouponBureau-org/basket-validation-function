services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: tcb-basket-validator:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      TCB_ENDPOINT: ${TCB_ENDPOINT:?Set TCB_ENDPOINT in docker/.env}
      TCB_ACCESS_KEY: ${TCB_ACCESS_KEY:?Set TCB_ACCESS_KEY in docker/.env}
      TCB_SECRET_KEY: ${TCB_SECRET_KEY:?Set TCB_SECRET_KEY in docker/.env}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
      REDIS_URL: redis://redis:6379
      MOF_SYNC_CRON: ${MOF_SYNC_CRON:-0 */4 * * *}
      MOF_SYNC_ON_START: ${MOF_SYNC_ON_START:-true}
      TZ: ${TZ:-UTC}
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - tcb-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  tcb-redis-data:
